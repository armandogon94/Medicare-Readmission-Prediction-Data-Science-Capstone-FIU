<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Benchmark comparison against published 30-day readmission models</title>
  <rect width="1100" height="480" fill="#FFFFFF"/>
  <text x="550" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#111827">Benchmark comparison — 30-day all-cause readmission on MIMIC-family data</text>
  <text x="550" y="52" font-size="12" text-anchor="middle" fill="#6B7280">Higher AUROC = better · dashed line = random baseline (0.50)</text>

  <!-- Axis (0.5 → 0.85 mapped to x 300 → 1020) -->
  <!-- Tick marks -->
  <line x1="300" y1="410" x2="1020" y2="410" stroke="#374151" stroke-width="1"/>
  <g font-size="11" fill="#6B7280">
    <line x1="300"  y1="410" x2="300"  y2="416" stroke="#6B7280"/><text x="300"  y="432" text-anchor="middle">0.50</text>
    <line x1="402.857" y1="410" x2="402.857" y2="416" stroke="#6B7280"/><text x="402.857" y="432" text-anchor="middle">0.55</text>
    <line x1="505.714" y1="410" x2="505.714" y2="416" stroke="#6B7280"/><text x="505.714" y="432" text-anchor="middle">0.60</text>
    <line x1="608.571" y1="410" x2="608.571" y2="416" stroke="#6B7280"/><text x="608.571" y="432" text-anchor="middle">0.65</text>
    <line x1="711.429" y1="410" x2="711.429" y2="416" stroke="#6B7280"/><text x="711.429" y="432" text-anchor="middle">0.70</text>
    <line x1="814.286" y1="410" x2="814.286" y2="416" stroke="#6B7280"/><text x="814.286" y="432" text-anchor="middle">0.75</text>
    <line x1="917.143" y1="410" x2="917.143" y2="416" stroke="#6B7280"/><text x="917.143" y="432" text-anchor="middle">0.80</text>
    <line x1="1020" y1="410" x2="1020" y2="416" stroke="#6B7280"/><text x="1020" y="432" text-anchor="middle">0.85</text>
  </g>
  <text x="660" y="455" font-size="12" font-weight="600" text-anchor="middle" fill="#374151">Test AUROC</text>

  <!-- AUROC scaled: x = 300 + (auroc - 0.5) * 2057.14 -->
  <!-- Bar parameters: height = 44, row spacing 62 -->

  <!-- 1: LACE -->
  <g transform="translate(0,80)">
    <text x="290" y="28" font-size="13" font-weight="600" text-anchor="end" fill="#111827">LACE (van Walraven 2010)</text>
    <text x="290" y="44" font-size="10" text-anchor="end" fill="#6B7280">traditional clinical score</text>
    <rect x="300" y="10" width="378.57" height="40" fill="#9CA3AF" rx="4"/>
    <text x="688" y="35" font-size="13" font-weight="700" fill="#111827">0.684</text>
  </g>

  <!-- 2: ClinicalBERT -->
  <g transform="translate(0,142)">
    <text x="290" y="28" font-size="13" font-weight="600" text-anchor="end" fill="#111827">ClinicalBERT (Huang 2020)</text>
    <text x="290" y="44" font-size="10" text-anchor="end" fill="#6B7280">BERT + free-text clinical notes</text>
    <rect x="300" y="10" width="440.00" height="40" fill="#6366F1" rx="4"/>
    <text x="749" y="35" font-size="13" font-weight="700" fill="#111827">0.714</text>
  </g>

  <!-- 3: Literature GBM baselines -->
  <g transform="translate(0,204)">
    <text x="290" y="28" font-size="13" font-weight="600" text-anchor="end" fill="#111827">Literature single LGBM / XGB</text>
    <text x="290" y="44" font-size="10" text-anchor="end" fill="#6B7280">tabular boosting baselines</text>
    <rect x="300" y="10" width="534.29" height="40" fill="#8B5CF6" rx="4"/>
    <text x="844" y="35" font-size="13" font-weight="700" fill="#111827">≈ 0.76</text>
  </g>

  <!-- 4: Ours XGBoost V7 (deployed) -->
  <g transform="translate(0,266)">
    <text x="290" y="28" font-size="13" font-weight="700" text-anchor="end" fill="#064E3B">★ Ours — XGBoost V7 (deployed)</text>
    <text x="290" y="44" font-size="10" text-anchor="end" fill="#065F46">50 structured features · no notes</text>
    <rect x="300" y="10" width="602.86" height="40" fill="#059669" rx="4"/>
    <text x="912" y="35" font-size="13" font-weight="800" fill="#064E3B">0.793</text>
    <!-- +0.109 vs LACE callout -->
    <line x1="678.57" y1="-200" x2="902.86" y2="-200" stroke="none"/>
  </g>

  <!-- 5: Ours 4-GBM blend -->
  <g transform="translate(0,328)">
    <text x="290" y="28" font-size="13" font-weight="700" text-anchor="end" fill="#065F46">Ours — 4-GBM scipy blend</text>
    <text x="290" y="44" font-size="10" text-anchor="end" fill="#065F46">benchmark ceiling · not deployed</text>
    <rect x="300" y="10" width="606.97" height="40" fill="#10B981" rx="4"/>
    <text x="916" y="35" font-size="13" font-weight="800" fill="#064E3B">0.795</text>
  </g>

  <!-- Uplift callouts -->
  <g>
    <line x1="678.57" y1="100" x2="902.86" y2="100" stroke="#047857" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="678.57" y1="96" x2="678.57" y2="106" stroke="#047857" stroke-width="1"/>
    <line x1="902.86" y1="96" x2="902.86" y2="106" stroke="#047857" stroke-width="1"/>
    <rect x="730" y="78" width="140" height="22" fill="#FFFFFF" rx="3"/>
    <text x="800" y="94" font-size="12" font-weight="700" text-anchor="middle" fill="#047857">+0.109 AUROC vs LACE</text>
  </g>

  <g>
    <line x1="740.00" y1="192" x2="902.86" y2="192" stroke="#047857" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="740.00" y1="188" x2="740.00" y2="198" stroke="#047857" stroke-width="1"/>
    <line x1="902.86" y1="188" x2="902.86" y2="198" stroke="#047857" stroke-width="1"/>
    <rect x="910" y="180" width="180" height="24" fill="#FFFFFF" stroke="#047857" stroke-width="1" rx="4"/>
    <text x="1000" y="197" font-size="12" font-weight="700" text-anchor="middle" fill="#047857">+0.079 vs ClinicalBERT</text>
  </g>

  <!-- Footer note -->
  <text x="550" y="470" font-size="10" text-anchor="middle" fill="#9CA3AF">Published benchmarks per Final Report §8.5 · ours evaluated on 49,191-admission held-out fold</text>
</svg>

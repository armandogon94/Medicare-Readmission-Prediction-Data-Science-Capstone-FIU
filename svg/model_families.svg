<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Model families evaluated on V6 · why gradient boosting won</title>
  <rect width="1200" height="560" fill="#FFFFFF"/>
  <text x="600" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#111827">Model families evaluated on V6 — gradient boosting beats deep learning</text>
  <text x="600" y="52" font-size="12" text-anchor="middle" fill="#6B7280">244,576 Medicare admissions · patient-grouped 80/20 split · Test AUROC</text>

  <!-- Axis (0.63 → 0.79 mapped to x 320 → 1000) · 680 px / 0.16 AUROC = 4250 px per 1.0 -->
  <line x1="320" y1="460" x2="1000" y2="460" stroke="#374151" stroke-width="1"/>
  <g font-size="11" fill="#6B7280">
    <line x1="320" y1="460" x2="320" y2="466" stroke="#6B7280"/><text x="320" y="482" text-anchor="middle">0.63</text>
    <line x1="405" y1="460" x2="405" y2="466" stroke="#6B7280"/><text x="405" y="482" text-anchor="middle">0.65</text>
    <line x1="490" y1="460" x2="490" y2="466" stroke="#6B7280"/><text x="490" y="482" text-anchor="middle">0.67</text>
    <line x1="575" y1="460" x2="575" y2="466" stroke="#6B7280"/><text x="575" y="482" text-anchor="middle">0.69</text>
    <line x1="660" y1="460" x2="660" y2="466" stroke="#6B7280"/><text x="660" y="482" text-anchor="middle">0.71</text>
    <line x1="745" y1="460" x2="745" y2="466" stroke="#6B7280"/><text x="745" y="482" text-anchor="middle">0.73</text>
    <line x1="830" y1="460" x2="830" y2="466" stroke="#6B7280"/><text x="830" y="482" text-anchor="middle">0.75</text>
    <line x1="915" y1="460" x2="915" y2="466" stroke="#6B7280"/><text x="915" y="482" text-anchor="middle">0.77</text>
    <line x1="1000" y1="460" x2="1000" y2="466" stroke="#6B7280"/><text x="1000" y="482" text-anchor="middle">0.79</text>
  </g>
  <text x="660" y="502" font-size="12" font-weight="600" text-anchor="middle" fill="#374151">Test AUROC on V6</text>

  <!-- Scale: x = 320 + (auroc - 0.63) * 4250 -->

  <!-- GRU alone — 0.636 · width = 0.006*4250 = 25.5 -->
  <g transform="translate(0,80)">
    <text x="310" y="26" font-size="12" font-weight="600" text-anchor="end" fill="#111827">Standalone RNN (GRU only)</text>
    <rect x="320" y="10" width="25.5" height="32" fill="#9CA3AF" rx="3"/>
    <text x="355" y="32" font-size="12" font-weight="700" fill="#111827">0.636</text>
    <text x="410" y="32" font-size="11" fill="#6B7280" font-style="italic">sequences alone insufficient</text>
  </g>

  <!-- Logistic Regression — 0.699 · width = 0.069*4250 = 293.25 -->
  <g transform="translate(0,122)">
    <text x="310" y="26" font-size="12" font-weight="600" text-anchor="end" fill="#111827">Logistic Regression</text>
    <rect x="320" y="10" width="293.25" height="32" fill="#D1D5DB" rx="3"/>
    <text x="623" y="32" font-size="12" font-weight="700" fill="#111827">0.699</text>
    <text x="670" y="32" font-size="11" fill="#6B7280" font-style="italic">linear · underfits V2 – V6</text>
  </g>

  <!-- MLP — 0.702 · width = 0.072*4250 = 306 -->
  <g transform="translate(0,164)">
    <text x="310" y="26" font-size="12" font-weight="600" text-anchor="end" fill="#111827">MLP [128, 64]</text>
    <rect x="320" y="10" width="306" height="32" fill="#CBD5E1" rx="3"/>
    <text x="636" y="32" font-size="12" font-weight="700" fill="#111827">0.702</text>
    <text x="680" y="32" font-size="11" fill="#6B7280" font-style="italic">shallow architecture plateaus</text>
  </g>

  <!-- LightGBM — 0.769 · width = 0.139*4250 = 590.75 -->
  <g transform="translate(0,206)">
    <text x="310" y="26" font-size="12" font-weight="600" text-anchor="end" fill="#111827">LightGBM</text>
    <rect x="320" y="10" width="590.75" height="32" fill="#22C55E" rx="3"/>
    <text x="920" y="32" font-size="12" font-weight="700" fill="#111827">0.769</text>
  </g>

  <!-- XGBoost — 0.771 · width = 0.141*4250 = 599.25 -->
  <g transform="translate(0,248)">
    <text x="310" y="26" font-size="12" font-weight="600" text-anchor="end" fill="#111827">XGBoost</text>
    <rect x="320" y="10" width="599.25" height="32" fill="#DC2626" rx="3"/>
    <text x="929" y="32" font-size="12" font-weight="700" fill="#111827">0.771</text>
  </g>

  <!-- FT-Transformer — 0.770 · width = 0.14*4250 = 595 -->
  <g transform="translate(0,290)">
    <text x="310" y="26" font-size="12" font-weight="600" text-anchor="end" fill="#111827">FT-Transformer</text>
    <rect x="320" y="10" width="595" height="32" fill="#7C3AED" rx="3"/>
    <text x="925" y="32" font-size="12" font-weight="700" fill="#111827">0.770</text>
  </g>

  <!-- GRU+MLP stacking — 0.778 · width = 0.148*4250 = 629 -->
  <g transform="translate(0,332)">
    <text x="310" y="26" font-size="12" font-weight="600" text-anchor="end" fill="#111827">GRU + MLP stacking ensemble</text>
    <rect x="320" y="10" width="629" height="32" fill="#A855F7" rx="3"/>
    <text x="959" y="32" font-size="12" font-weight="700" fill="#111827">0.778</text>
  </g>

  <!-- dashed line at MLP level -->
  <line x1="626" y1="80" x2="626" y2="380" stroke="#EF4444" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <text x="631" y="410" font-size="10" fill="#EF4444" font-style="italic">MLP baseline (0.702)</text>

  <!-- Gradient-boosting cluster bracket moved to x=1005-1025 with text centered vertically -->
  <path d="M 1005 216 Q 1025 216 1025 244 L 1025 358 Q 1025 386 1005 386" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="1045" y="305" font-size="11" font-weight="700" fill="#047857" transform="rotate(90, 1045, 305)" text-anchor="middle">boosting + ensembles</text>

  <!-- Takeaway box — text wrapped to 3 lines so nothing overflows -->
  <g transform="translate(320,390)">
    <rect width="680" height="62" rx="8" fill="#F0FDF4" stroke="#86EFAC"/>
    <text x="16" y="20" font-size="11" font-weight="700" fill="#065F46">Takeaway</text>
    <text x="16" y="38" font-size="11" fill="#064E3B">Gradient boosting matches or beats specialised tabular deep-learning (FT-Transformer,</text>
    <text x="16" y="54" font-size="11" fill="#064E3B">GRU + MLP) at a fraction of the engineering complexity — motivates the 4-GBM ensemble on V7.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Cohort construction funnel</title>
  <rect width="1100" height="520" fill="#FFFFFF"/>
  <text x="550" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#111827">Cohort construction · from full MIMIC-IV release to train / test folds</text>
  <text x="550" y="52" font-size="12" text-anchor="middle" fill="#6B7280">All filters applied before model training · no leakage back from held-out fold</text>

  <defs>
    <marker id="funnelArrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#475569"/>
    </marker>
    <linearGradient id="gradBlue" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Stage 1 : Full MIMIC-IV release -->
  <g transform="translate(200,80)">
    <polygon points="0,0 700,0 620,60 80,60" fill="#1E3A8A"/>
    <text x="350" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">Full MIMIC-IV v3.1 release</text>
    <text x="350" y="48" font-size="13" font-weight="600" text-anchor="middle" fill="#DBEAFE">546,028 admissions · 364,627 unique patients · 2008 – 2022</text>
  </g>
  <text x="905" y="118" font-size="12" font-weight="600" fill="#475569">100 %</text>

  <line x1="550" y1="142" x2="550" y2="172" stroke="#475569" stroke-width="2" marker-end="url(#funnelArrow)"/>
  <text x="560" y="162" font-size="11" fill="#475569">filter: insurance == 'Medicare'</text>

  <!-- Stage 2 : Medicare cohort -->
  <g transform="translate(240,178)">
    <polygon points="40,0 580,0 540,60 80,60" fill="#2563EB"/>
    <text x="310" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">Medicare cohort</text>
    <text x="310" y="48" font-size="13" font-weight="600" text-anchor="middle" fill="#DBEAFE">244,576 admissions · 21.1 % positive readmit_30d</text>
  </g>
  <text x="905" y="216" font-size="12" font-weight="600" fill="#475569">44.8 %</text>

  <line x1="550" y1="240" x2="550" y2="270" stroke="#475569" stroke-width="2" marker-end="url(#funnelArrow)"/>
  <text x="560" y="260" font-size="11" fill="#475569">GroupShuffleSplit 80 / 20 on subject_id · random_state = 42</text>

  <!-- Stage 3 : split into train and test -->
  <g transform="translate(260,276)">
    <!-- Train trapezoid -->
    <polygon points="0,0 420,0 380,60 40,60" fill="#4F46E5"/>
    <text x="210" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">Train fold</text>
    <text x="210" y="48" font-size="12" font-weight="600" text-anchor="middle" fill="#E0E7FF">195,385 admissions · used for HPO &amp; fitting</text>
  </g>
  <text x="905" y="314" font-size="12" font-weight="600" fill="#475569">35.8 %</text>

  <g transform="translate(690,276)">
    <!-- Test trapezoid -->
    <polygon points="0,0 160,0 140,60 20,60" fill="#0F766E"/>
    <text x="80" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">Test fold</text>
    <text x="80" y="48" font-size="12" font-weight="600" text-anchor="middle" fill="#CCFBF1">49,191</text>
  </g>
  <text x="870" y="314" font-size="12" font-weight="600" fill="#475569">9.0 %</text>

  <line x1="470" y1="344" x2="470" y2="380" stroke="#475569" stroke-width="2" marker-end="url(#funnelArrow)"/>
  <text x="480" y="368" font-size="11" fill="#475569">V7 feature build · 50 engineered columns</text>

  <!-- Stage 4 : Modeling ready -->
  <g transform="translate(310,386)">
    <polygon points="0,0 320,0 280,60 40,60" fill="#047857"/>
    <text x="160" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">Modeling-ready V7 matrix</text>
    <text x="160" y="48" font-size="12" font-weight="600" text-anchor="middle" fill="#D1FAE5">195,385 × 50 (train) · 49,191 × 50 (test)</text>
  </g>

  <!-- Legend / key -->
  <g transform="translate(200,492)">
    <text x="0" y="0" font-size="10" fill="#6B7280">Percentages shown vs full 546,028-admission release · train/test split performed at the patient level so no subject_id appears in both folds</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>4-GBM scipy-optimized blend weights</title>
  <rect width="900" height="420" fill="#FFFFFF"/>
  <text x="450" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#111827">4-GBM scipy-optimized blend weights · AUROC 0.795</text>
  <text x="450" y="52" font-size="12" text-anchor="middle" fill="#6B7280">Nelder-Mead minimizing negative OOF AUROC · weights sum to 1 · non-negative</text>

  <!-- Donut chart centered at (240,230) · r_outer=130 · r_inner=75 -->
  <!-- Slice boundaries (cumulative, clockwise from top):
       LGB 0.19 → 0° to  68.4°
       XGB 0.30 → 68.4° to 176.4°
       CAT 0.30 → 176.4° to 284.4°
       HGB 0.21 → 284.4° to 360°                                        -->

  <!-- LightGBM -->
  <path d="M 240 100
           A 130 130 0 0 1 360.87 182.14
           L 309.73 202.39
           A 75 75 0 0 0 240 155 Z"
        fill="#22C55E" stroke="#FFFFFF" stroke-width="2"/>

  <!-- XGBoost -->
  <path d="M 360.87 182.14
           A 130 130 0 0 1 248.16 359.74
           L 244.71 304.85
           A 75 75 0 0 0 309.73 202.39 Z"
        fill="#DC2626" stroke="#FFFFFF" stroke-width="2"/>

  <!-- CatBoost -->
  <path d="M 248.16 359.74
           A 130 130 0 0 1 114.08 197.67
           L 167.36 211.35
           A 75 75 0 0 0 244.71 304.85 Z"
        fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>

  <!-- HistGBM -->
  <path d="M 114.08 197.67
           A 130 130 0 0 1 240 100
           L 240 155
           A 75 75 0 0 0 167.36 211.35 Z"
        fill="#7C3AED" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Center label -->
  <text x="240" y="226" font-size="28" font-weight="800" text-anchor="middle" fill="#111827">0.795</text>
  <text x="240" y="246" font-size="12" text-anchor="middle" fill="#6B7280">blend AUROC</text>

  <!-- Slice % labels (centered per slice at r=100) -->
  <text x="296" y="152" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">19 %</text>
  <text x="324" y="288" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">30 %</text>
  <text x="163" y="298" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">30 %</text>
  <text x="179" y="156" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">21 %</text>

  <!-- Legend + summary panel on right -->
  <g transform="translate(460,90)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#111827">Family contributions &amp; stand-alone AUROC</text>

    <g transform="translate(0,24)">
      <rect width="16" height="16" fill="#22C55E" rx="3"/>
      <text x="26" y="13" font-size="13" font-weight="600" fill="#111827">LightGBM</text>
      <text x="130" y="13" font-size="12" fill="#4B5563">weight 0.19</text>
      <text x="230" y="13" font-size="12" fill="#4B5563">individual AUROC 0.7901</text>
    </g>

    <g transform="translate(0,52)">
      <rect width="16" height="16" fill="#DC2626" rx="3"/>
      <text x="26" y="13" font-size="13" font-weight="700" fill="#7F1D1D">★ XGBoost</text>
      <text x="130" y="13" font-size="12" fill="#4B5563">weight 0.30</text>
      <text x="230" y="13" font-size="12" font-weight="600" fill="#7F1D1D">individual AUROC 0.7931</text>
    </g>

    <g transform="translate(0,80)">
      <rect width="16" height="16" fill="#F59E0B" rx="3"/>
      <text x="26" y="13" font-size="13" font-weight="600" fill="#111827">CatBoost</text>
      <text x="130" y="13" font-size="12" fill="#4B5563">weight 0.30</text>
      <text x="230" y="13" font-size="12" fill="#4B5563">individual AUROC 0.7924</text>
    </g>

    <g transform="translate(0,108)">
      <rect width="16" height="16" fill="#7C3AED" rx="3"/>
      <text x="26" y="13" font-size="13" font-weight="600" fill="#111827">HistGBM</text>
      <text x="130" y="13" font-size="12" fill="#4B5563">weight 0.21</text>
      <text x="230" y="13" font-size="12" fill="#4B5563">individual AUROC 0.7916</text>
    </g>

    <line x1="0" y1="150" x2="420" y2="150" stroke="#E5E7EB" stroke-width="1"/>

    <g transform="translate(0,172)">
      <rect width="420" height="86" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#111827">Deployment decision</text>
      <text x="14" y="42" font-size="11" fill="#374151">XGBoost alone = 0.7931 · 4-GBM blend = 0.7948</text>
      <text x="14" y="58" font-size="11" fill="#374151">Gap: only +0.002 AUROC for 4× maintenance footprint.</text>
      <text x="14" y="74" font-size="11" font-weight="600" fill="#047857">→ single XGBoost deployed · blend retained as ceiling.</text>
    </g>
  </g>

  <text x="240" y="395" font-size="10" text-anchor="middle" fill="#9CA3AF">Weights from scipy.optimize.minimize on out-of-fold predictions · constraint Σw = 1, w ≥ 0</text>
</svg>
